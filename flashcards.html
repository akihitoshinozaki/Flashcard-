<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flashcards">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E7EAED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13171D" media="(prefers-color-scheme: dark)">
<title>Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap">
<style>
:root{
  --desk:#E7EAED; --card:#FFFFFF; --field:#F3F5F7;
  --ink:#1E2631; --ink-2:#4B5663; --muted:#5F6A76;
  --line:#D4DAE0; --edge:#BCC5CE;
  --red:#E0625C; --blue:#D9E6F2;
  --no:#BF4D3B; --almost:#8A6312; --know:#276F55;
  --no-bg:#F6E3DF; --almost-bg:#F3EAD3; --know-bg:#DDEFE6;
  --shadow:0 1px 1px rgba(30,38,49,.06), 0 12px 32px -14px rgba(30,38,49,.30);
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --desk:#13171D; --card:#1E242C; --field:#171C22;
    --ink:#E6EAEE; --ink-2:#B4BDC7; --muted:#8B95A1;
    --line:#2B333C; --edge:#3D4752;
    --red:#B4544F; --blue:#29323C;
    --no:#E47B67; --almost:#D8AE59; --know:#5FBB96;
    --no-bg:#3A2420; --almost-bg:#372E1B; --know-bg:#1C3328;
    --shadow:0 1px 1px rgba(0,0,0,.35), 0 16px 36px -16px rgba(0,0,0,.75);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--desk);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px}
[hidden]{display:none!important}
a{color:inherit;text-underline-offset:3px}

.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px;display:flex;flex-direction:column}
.banner{margin:10px 20px 0;padding:10px 12px;border-radius:10px;background:var(--almost-bg);font-size:14px;line-height:1.4}

/* ---------- top bar ---------- */
.bar{flex:none;display:flex;align-items:center;gap:10px;min-height:56px}
.pack-btn{display:flex;align-items:center;gap:7px;min-width:0;background:none;border:0;padding:8px 0;cursor:pointer;font-weight:700;font-size:17px;text-align:left}
.pack-btn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pack-btn .fo{font-weight:400;color:var(--muted);white-space:nowrap}
.pack-btn svg{flex:none;color:var(--muted)}
.bar .sp{flex:1}
.undo{display:flex;align-items:center;gap:5px;background:none;border:0;color:var(--ink-2);padding:8px 2px;cursor:pointer;font-size:15px}
.count{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- study ---------- */
.study{flex:1;min-height:0;display:flex;flex-direction:column}
.track{flex:none;display:flex;gap:2px;height:3px;margin:0 0 20px}
.track i{flex:1;border-radius:2px;background:var(--line)}
.track.solid{gap:0}
.track.solid i{border-radius:0}
.track i.know{background:var(--know)}
.track i.almost{background:var(--almost)}
.track i.no{background:var(--no)}
.track i.cur{background:var(--ink)}

.stage{position:relative;flex:1;min-height:250px;max-height:560px;margin:0 0 18px}
.card{position:absolute;inset:0;perspective:1600px;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;-webkit-touch-callout:none}
.card:active{cursor:grabbing}
.card.next{pointer-events:none;transform:translateY(12px) scale(.94);transform-origin:50% 100%;animation:fadein .25s ease}
.flip{position:relative;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.25,.8,.25,1)}
.card.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--card);border-radius:7px;box-shadow:var(--shadow);overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden;transition:box-shadow .15s}
.back{transform:rotateY(180deg)}
.card[data-g="know"] .face{box-shadow:0 0 0 2px var(--know),var(--shadow)}
.card[data-g="almost"] .face{box-shadow:0 0 0 2px var(--almost),var(--shadow)}
.card[data-g="no"] .face{box-shadow:0 0 0 2px var(--no),var(--shadow)}

.front{padding:18px 24px 20px}
.meta{flex:none;display:flex;justify-content:space-between;gap:16px;font-size:14px;color:var(--muted);min-height:20px}
.meta span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.term{flex:1;min-height:0;display:flex;align-items:center;overflow:hidden;font-family:var(--serif);font-weight:440;font-size:40px;line-height:1.08;letter-spacing:-.015em;font-variation-settings:"opsz" 72;overflow-wrap:break-word;hyphens:auto}
.term span{min-width:0;max-width:100%}
.hint{flex:none;font-size:14px;color:var(--muted)}

.bhead{flex:none;padding:16px 24px 9px;border-bottom:1.5px solid var(--red);font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.def{flex:1;min-height:0;overflow:hidden;margin:6px 0 0;padding:0 24px;font-family:var(--serif);font-size:var(--fs,19px);line-height:var(--lh,30px);
  background-image:linear-gradient(transparent calc(var(--lh,30px) - 1px),var(--blue) 0);background-size:100% var(--lh,30px);background-origin:content-box;background-position:0 -2px}

.grades{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.g{--c:var(--ink);--b:transparent;display:flex;align-items:center;justify-content:center;gap:7px;height:56px;border-radius:14px;border:1.5px solid var(--edge);background:transparent;font-weight:700;font-size:15.5px;cursor:pointer;transition:background-color .15s,border-color .15s,color .15s}
.g svg{flex:none;color:var(--c)}
.g.no{--c:var(--no);--b:var(--no-bg)}
.g.almost{--c:var(--almost);--b:var(--almost-bg)}
.g.know{--c:var(--know);--b:var(--know-bg)}
.g{white-space:nowrap;padding:0 6px}
@media (max-width:360px){.g{font-size:14.5px;gap:4px}.g svg{width:14px;height:14px}.grades{gap:8px}}
.g.hot,.g:active{background:var(--b);border-color:var(--c);color:var(--c)}
@media (hover:hover){.g:hover{border-color:var(--c)}}
.keys{display:none;flex:none;text-align:center;font-size:13.5px;color:var(--muted);margin:-2px 0 14px}
@media (hover:hover) and (pointer:fine){.keys{display:block}}

.done{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 2px 48px}
.done h2{font:440 34px/1.1 var(--serif);letter-spacing:-.015em;margin:0 0 10px;font-variation-settings:"opsz" 72}
.done p{margin:0 0 18px;color:var(--ink-2);font-size:16.5px;max-width:36ch}
.mix{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;margin:2px 0 26px}
.mix .know{background:var(--know)} .mix .almost{background:var(--almost)} .mix .no{background:var(--no)}
.actions{display:grid;gap:10px}
.done .note{color:var(--muted);font-size:15px;margin:18px 0 0}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:0;border-radius:14px;background:var(--ink);color:var(--desk);font-weight:700;font-size:16px;cursor:pointer;padding:0 16px}
.btn:disabled{opacity:.35;cursor:default}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--edge)}
.btn.danger{background:transparent;color:var(--no);border:1.5px solid var(--edge)}
.btn.danger.armed{background:var(--no);color:var(--card);border-color:var(--no)}
.txt{background:none;border:0;padding:8px 0;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--edge);text-underline-offset:4px;cursor:pointer;font-size:15px}

/* ---------- pages ---------- */
.page{flex:none;padding:0 0 32px}
.top{display:flex;align-items:center;min-height:56px;margin-bottom:6px}
.title{font:440 32px/1.1 var(--serif);letter-spacing:-.015em;margin:0 0 22px;font-variation-settings:"opsz" 72}
.h2{font:700 17px/1.3 var(--sans);margin:30px 0 6px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--line);gap:2px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-size:15px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.wide{display:grid;grid-template-columns:repeat(4,1fr);width:100%}
.seg.wide button{padding:9px 4px;font-size:14.5px}
.field{margin-bottom:18px}
.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px;color:var(--ink-2);margin-bottom:7px}
.lbl .bad{color:var(--no)}
.in,.ta{display:block;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.45;-webkit-appearance:none;appearance:none}
.in:focus,.ta:focus{border-color:var(--ink-2)}
.in:focus-visible,.ta:focus-visible,.sheet:focus-visible{outline:none}
.in::placeholder,.ta::placeholder{color:var(--muted);opacity:.8}
.ta{min-height:150px;resize:vertical}
.ta.serif{font-family:var(--serif);font-size:18px;line-height:1.5}
.row2{display:flex;gap:8px}
.row2 .in{flex:1;min-width:0}
.gen{flex:none;display:flex;align-items:center;justify-content:center;min-width:104px;border:1.5px solid var(--edge);background:transparent;border-radius:12px;padding:0 14px;font-weight:700;cursor:pointer}
.gen:disabled{opacity:.6;cursor:default}
.err{margin:-6px 0 16px;color:var(--no);font-size:15px}
.help{color:var(--muted);font-size:14.5px;margin:14px 0 0;line-height:1.5}
.help.top0{margin-top:0}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- card list ---------- */
.search{margin-bottom:6px}
.filters{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:12px 0 10px;color:var(--muted);font-size:15px;cursor:pointer}
.filters button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.filters b{font-weight:400;color:var(--muted);margin-left:5px;font-variant-numeric:tabular-nums}
.item{display:flex;gap:14px;align-items:flex-start;width:100%;padding:14px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.item .m{flex:1;min-width:0}
.item .t{display:block;font:480 19px/1.25 var(--serif)}
.item .d{display:block;color:var(--muted);font-size:14px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{flex:none;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);padding-top:3px;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.empty{color:var(--muted);padding:28px 0;margin:0}
.foot{display:flex;flex-wrap:wrap;gap:2px 22px;padding:18px 0 0}

/* ---------- tabs ---------- */
.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding:0 12px env(safe-area-inset-bottom)}
.tab{position:relative;height:58px;background:none;border:0;color:var(--muted);font-size:15.5px;cursor:pointer}
.tab.on{color:var(--ink);font-weight:700}
.tab.on::after{content:"";position:absolute;top:-1px;left:50%;width:28px;margin-left:-14px;height:2px;border-radius:0 0 2px 2px;background:var(--ink)}
.tab .n{font-weight:400;color:var(--muted);font-size:13.5px;margin-left:5px;font-variant-numeric:tabular-nums}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(12,16,22,.42);opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:480px;margin:0 auto;max-height:88vh;max-height:88dvh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.sheet.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sheet .in,.sheet .ta{background:var(--field)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 18px}
.sh-t{font:440 26px/1.15 var(--serif);letter-spacing:-.01em;margin:0 0 14px;font-variation-settings:"opsz" 72}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:13px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;font-size:16.5px}
.opt .ck{flex:none;width:18px;display:flex}
.opt .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .c{color:var(--muted);font-size:14.5px;white-space:nowrap}
.opt.on .n{font-weight:700}
.sub{font-size:15px;color:var(--ink-2);margin:22px 0 8px}
.fdesc{color:var(--muted);font-size:14.5px;margin:8px 0 0}
.switch{position:relative;display:flex;align-items:center;justify-content:space-between;padding:18px 0 4px;font-size:16.5px;cursor:pointer}
.switch input{position:absolute;opacity:0;pointer-events:none}
.sw{position:relative;flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked + .sw{background:var(--ink)}
.switch input:checked + .sw::after{transform:translateX(18px);background:var(--desk)}
.switch input:focus-visible + .sw{outline:2px solid var(--ink-2);outline-offset:2px}
.link-box{min-height:96px;font-size:13px;word-break:break-all}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));z-index:60;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:var(--ink);color:var(--desk);padding:10px 16px;border-radius:12px;font-size:15px;max-width:calc(100vw - 40px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.over{bottom:auto;top:calc(env(safe-area-inset-top) + 14px)}

/* ---------- motion ---------- */
@keyframes fadein{from{opacity:0}}
@keyframes in-know{from{transform:translateX(120%) rotate(16deg)}}
@keyframes in-no{from{transform:translateX(-120%) rotate(-16deg)}}
@keyframes in-almost{from{transform:translateY(-110%) scale(.92)}}
.card.in-know{animation:in-know .34s cubic-bezier(.2,.8,.2,1)}
.card.in-no{animation:in-no .34s cubic-bezier(.2,.8,.2,1)}
.card.in-almost{animation:in-almost .34s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){
  .flip,.sheet,.scrim,.toast,.face{transition:none!important}
  .card{animation:none!important}
}
</style>
</head>
<body>
<div class="app">
  <div id="banner"></div>
  <main id="main"></main>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div>
<div class="scrim" id="scrim" data-act="close-sheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ============================================================
   Constants
   ============================================================ */
const DAY = 86400000;
const INTERVALS = [1, 3, 7, 14, 30];           // days between reviews once you know a card
const KEYS = {
  deck: "flashcards-deck-v1",                  // same key as before, so existing cards carry over
  settings: "flashcards-settings-v1",
  prefs: "flashcards-prefs-v2",
  round: "flashcards-round-v2",
  oldSession: "flashcards-session-v1"
};
const MANUAL_PACK = "My cards";
const STALE = 6 * 3600000;                     // a round untouched for 6 hours starts fresh
const FOCI = [
  ["queue",  "To study",  "New, Not yet, Almost, and cards due for review."],
  ["no",     "Not yet",   "Only new cards and ones you marked Not yet."],
  ["almost", "Almost",    "Only cards you marked Almost."],
  ["all",    "All cards", "Every card in the pack, even ones not due yet."]
];
const STATUS = {
  new:    { label: "New",     color: "var(--edge)" },
  no:     { label: "Not yet", color: "var(--no)" },
  almost: { label: "Almost",  color: "var(--almost)" },
  due:    { label: "Review",  color: "var(--ink)" },
  known:  { label: "Known",   color: "var(--know)" }
};
const DEFAULTS = [
  { front: "Phantom lesion", back: "An abnormality that appears on medical imaging but does not actually exist in the patient. Usually caused by imaging artifacts, patient movement, or misreading normal anatomy as pathology." },
  { front: "Anatomical disorder", back: "A condition involving structural abnormalities of the body: organs or tissues that are malformed, mispositioned, or absent. Distinct from functional disorders, which affect how the body works rather than how it is built." },
  { front: "Biopsy", back: "A procedure in which a small tissue or cell sample is removed for microscopic examination, used to diagnose disease (especially cancer). Types include needle, surgical, and endoscopic biopsy." }
];
const ICON = {
  chev: '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3.5 5.25 7 8.75l3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  undo: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5.5 3.5 2.5 6.5l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 6.5h7a4 4 0 0 1 0 8H7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  check: '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="m4 9.5 3.2 3L14 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  left:  '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 8H3m0 0 4-4M3 8l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  up:    '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 13V3m0 0L4 7m4-4 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  right: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10m0 0-4-4m4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

/* ============================================================
   Storage (falls back to memory where saving is blocked)
   ============================================================ */
const mem = {};
let storageOK = true;
try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); } catch (e) { storageOK = false; }
function load(k, fallback) {
  try { const v = storageOK ? localStorage.getItem(k) : mem[k]; return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function save(k, v) {
  try { const s = JSON.stringify(v); if (storageOK) localStorage.setItem(k, s); else mem[k] = s; } catch (e) {}
}

/* ============================================================
   Data
   ============================================================ */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function makeCard(o, pack) {
  const t = Date.now();
  return { id: uid(), front: o.front, back: o.back, pack: pack || MANUAL_PACK, addedAt: t,
           level: 0, nextReview: t, lastReviewed: null, inRotation: false, almost: false, seen: false };
}
// Bring cards saved by the earlier version up to date without losing anything.
function fixCard(c) {
  if (!c.id) c.id = uid();
  c.front = String(c.front || ""); c.back = String(c.back || "");
  if (!c.pack) c.pack = MANUAL_PACK;
  if (typeof c.level !== "number") c.level = 0;
  if (typeof c.nextReview !== "number") c.nextReview = Date.now();
  if (typeof c.inRotation !== "boolean") c.inRotation = c.lastReviewed != null || c.level > 0;
  if (typeof c.almost !== "boolean") c.almost = false;
  if (typeof c.seen !== "boolean") c.seen = c.lastReviewed != null || c.inRotation || c.almost;
  if (!c.addedAt) c.addedAt = Date.now();
  if (c.lastReviewed === undefined) c.lastReviewed = null;
}

let cards = load(KEYS.deck, null);
if (!Array.isArray(cards)) cards = DEFAULTS.map(d => makeCard(d));
cards = cards.filter(c => c && c.front != null && c.back != null);
cards.forEach(fixCard);
save(KEYS.deck, cards);

let settings = Object.assign({ baseUrl: "https://api.groq.com/openai/v1", apiKey: "", model: "llama-3.3-70b-versatile" }, load(KEYS.settings, {}) || {});
const storedPrefs = load(KEYS.prefs, null);
let prefs = Object.assign({ pack: "", focus: "queue", shuffle: false, flipped: false, addPack: "" }, storedPrefs || {});
if (!storedPrefs) {                                   // carry over the old pack filter and "Mix" setting
  const old = load(KEYS.oldSession, null);
  if (old) {
    if (typeof old.packFilter === "string") prefs.pack = old.packFilter;
    if (old.browseOrder && old.browseOrder.length) prefs.shuffle = true;
  }
}
if (prefs.pack && !cards.some(c => c.pack === prefs.pack)) prefs.pack = "";
if (!FOCI.some(f => f[0] === prefs.focus)) prefs.focus = "queue";
let round = load(KEYS.round, null);

function persist() { save(KEYS.deck, cards); }

function saveRound() { save(KEYS.round, round); }

/* ============================================================
   UI state
   ============================================================ */

let flipped = false;
let undoStack = [];
let enterFrom = null;
let animating = false;
let drag = null;
let sheetOpen = false;
let addMode = "one";
let draft = { term: "", def: "", pack: "", err: "" };
let imp = { name: "", text: "", auto: false };
let busy = false;
let libFilter = "all";
let libQuery = "";
let editingId = null;
let pending = null;

const $ = s => document.querySelector(s);
const main = $("#main"), tabsEl = $("#tabs"), sheet = $("#sheet"), scrim = $("#scrim"), toastEl = $("#toast");

/* ============================================================
   Helpers
   ============================================================ */
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function byId(id) { return cards.find(c => c.id === id) || null; }

// A study "day" starts at 4am, so a card due "tomorrow" is ready tomorrow morning.
function dueAt(days) {
  const d = new Date();
  if (d.getHours() < 4) d.setDate(d.getDate() - 1);
  d.setDate(d.getDate() + days);
  d.setHours(4, 0, 0, 0);
  return d.getTime();
}
function dayNum(ts) {
  const d = new Date(ts);
  if (d.getHours() < 4) d.setDate(d.getDate() - 1);
  d.setHours(12, 0, 0, 0);
  return Math.round(d.getTime() / DAY);
}
function whenText(ts) {
  if (ts <= Date.now()) return "now";
  const n = dayNum(ts) - dayNum(Date.now());
  if (n <= 0) return "later today";
  if (n === 1) return "tomorrow";
  return "in " + n + " days";
}

function status(c, now) {
  now = now || Date.now();
  if (c.almost) return "almost";
  if (c.inRotation) return c.nextReview <= now ? "due" : "known";
  return c.seen ? "no" : "new";
}
function inPack(c) { return !prefs.pack || c.pack === prefs.pack; }
function eligible(c, focus, now) {
  const s = status(c, now);
  if (focus === "no") return s === "new" || s === "no";
  if (focus === "almost") return s === "almost";
  if (focus === "all") return true;
  return s !== "known";
}
function packs() {
  const seen = new Set(), out = [];
  cards.forEach(c => { if (!seen.has(c.pack)) { seen.add(c.pack); out.push(c.pack); } });
  out.sort((a, b) => (a === MANUAL_PACK ? -1 : b === MANUAL_PACK ? 1 : 0));
  return out;
}
function packLabel() {
  if (prefs.pack) return prefs.pack;
  const p = packs();
  return p.length === 1 ? p[0] : "All packs";
}
function toStudyCount(pack) {
  const now = Date.now();
  return cards.filter(c => (!pack || c.pack === pack) && status(c, now) !== "known").length;
}
function packTotal(pack) { return cards.filter(c => !pack || c.pack === pack).length; }

/* ============================================================
   Rounds: one pass through the cards that need attention
   ============================================================ */
function roundKey() { return prefs.pack + "\u0001" + prefs.focus; }
function buildIds() {
  const now = Date.now();
  const list = cards.filter(c => inPack(c) && eligible(c, prefs.focus, now));
  let due = list.filter(c => status(c, now) === "due").sort((a, b) => a.nextReview - b.nextReview);
  let rest = list.filter(c => status(c, now) !== "due");
  if (prefs.shuffle) { due = shuffle(due); rest = shuffle(rest); }
  return due.concat(rest).map(c => c.id);
}
function newRound() {
  round = { key: roundKey(), ids: buildIds(), pos: 0, res: {}, ts: Date.now() };
  undoStack = [];
  flipped = false;
  saveRound();
}
function syncRound() {
  const now = Date.now();
  if (!round || round.key !== roundKey() || !Array.isArray(round.ids) || now - (round.ts || 0) > STALE) { newRound(); return; }
  const map = new Map(cards.map(c => [c.id, c]));
  let pos = round.pos;
  const ids = [];
  round.ids.forEach((id, i) => {
    const c = map.get(id);
    const keep = c && (i < round.pos || inPack(c));
    if (keep) ids.push(id); else if (i < round.pos) pos--;
  });
  const have = new Set(ids);
  cards.forEach(c => { if (!have.has(c.id) && inPack(c) && eligible(c, prefs.focus, now)) ids.push(c.id); });
  round.ids = ids;
  round.pos = Math.max(0, Math.min(pos, ids.length));
  if (!round.res) round.res = {};
}
function currentCard() { return round && round.pos < round.ids.length ? byId(round.ids[round.pos]) : null; }

function grade(g) {
  const c = currentCard();
  if (!c) return;
  undoStack.push({ id: c.id, before: JSON.parse(JSON.stringify(c)), pos: round.pos, res: round.res[c.id], g });
  if (undoStack.length > 100) undoStack.shift();
  const now = Date.now(), s = status(c, now);
  if (g === "know") {
    if (!c.inRotation) {                         // first time you know it: back tomorrow
      c.inRotation = true; c.almost = false; c.level = 0;
      c.nextReview = dueAt(INTERVALS[0]); c.lastReviewed = now;
    } else if (s === "due") {                    // passed a review: step up the ladder
      c.level = Math.min(c.level + 1, INTERVALS.length - 1);
      c.nextReview = dueAt(INTERVALS[c.level]); c.lastReviewed = now;
    }                                            // known and not due yet (All cards mode): schedule unchanged
  } else if (g === "almost") {
    c.almost = true; c.inRotation = false; c.level = 0;
  } else {
    c.almost = false; c.inRotation = false; c.level = 0;
  }
  c.seen = true;
  round.res[c.id] = g;
  round.pos++;
  round.ts = now;
  flipped = false;
  persist(); saveRound();
}
function undo() {
  if (animating || !round) return;
  const u = undoStack.pop();
  if (!u) return;
  const i = cards.findIndex(c => c.id === u.id);
  if (i >= 0) cards[i] = u.before; else cards.push(u.before);
  round.pos = u.pos;
  if (u.res) round.res[u.id] = u.res; else delete round.res[u.id];
  const at = round.ids.indexOf(u.id);
  if (at !== round.pos) { if (at >= 0) round.ids.splice(at, 1); round.ids.splice(round.pos, 0, u.id); }
  round.ts = Date.now();
  persist(); saveRound();
  flipped = false; enterFrom = u.g;
  if (view !== "study") view = "study";
  render();
}

/* ============================================================
   Render
   ============================================================ */
function render() {
  if (view === "study") main.innerHTML = studyHTML();
  else if (view === "add") main.innerHTML = addHTML();
  else if (view === "cards") main.innerHTML = cardsHTML();
  else if (view === "settings") main.innerHTML = settingsHTML();
  renderTabs();
  if (view === "study") fitAll();
  if (view === "cards") $("#rows").innerHTML = rowsHTML();
  if (view === "add" && addMode === "paste") updateImportInfo();
}
function renderTabs() {
  const n = toStudyCount(prefs.pack);
  const cur = view === "settings" ? "cards" : view;
  tabsEl.innerHTML = [["study", "Study", n], ["add", "Add", 0], ["cards", "Cards", 0]].map(t =>
    `<button class="tab${cur === t[0] ? " on" : ""}" data-act="go" data-v="${t[0]}"${cur === t[0] ? ' aria-current="page"' : ""}>${t[1]}${t[2] ? `<span class="n">${t[2]}</span>` : ""}</button>`
  ).join("");
}
function go(v) {
  if (view === v && v !== "study") return;
  view = v; flipped = false; main.scrollTop = 0; render();
}

function barHTML(isStudy) {
  const focus = FOCI.find(f => f[0] === prefs.focus);
  let right = "";
  if (isStudy) {
    if (undoStack.length) right += `<button class="undo" data-act="undo" aria-label="Undo last card">${ICON.undo}Undo</button>`;
    if (round && round.pos < round.ids.length) right += `<span class="count">${round.pos + 1} of ${round.ids.length}</span>`;
  } else {
    right = `<span class="count">${plural(packTotal(prefs.pack), "card")}</span>`;
  }
  return `<div class="bar"><button class="pack-btn" data-act="packs" aria-haspopup="dialog"><span class="nm">${esc(packLabel())}</span>${isStudy && prefs.focus !== "queue" ? `<span class="fo">${focus[1]}</span>` : ""}${ICON.chev}</button><span class="sp"></span>${right}</div>`;
}

/* ---------- Study ---------- */
function studyHTML() {
  syncRound();
  let h = '<section class="study">' + barHTML(true);
  if (!cards.length) return h + emptyDeckHTML() + "</section>";
  const c = currentCard();
  if (round.ids.length) h += trackHTML();
  if (!round.ids.length) h += caughtUpHTML();
  else if (!c) h += finishedHTML();
  else h += stageHTML(c) + gradesHTML();
  return h + "</section>";
}
function trackHTML() {
  const ids = round.ids, n = ids.length, cls = { know: "know", almost: "almost", no: "no" };
  if (n > 60) {
    let k = 0, a = 0, no = 0;
    ids.slice(0, round.pos).forEach(id => { const r = round.res[id]; if (r === "know") k++; else if (r === "almost") a++; else if (r === "no") no++; });
    const rest = n - k - a - no;
    return `<div class="track solid" aria-hidden="true"><i class="know" style="flex:${k}"></i><i class="almost" style="flex:${a}"></i><i class="no" style="flex:${no}"></i><i style="flex:${rest}"></i></div>`;
  }
  return '<div class="track" aria-hidden="true">' + ids.map((id, i) =>
    `<i class="${i < round.pos ? (cls[round.res[id]] || "") : i === round.pos ? "cur" : ""}"></i>`).join("") + "</div>";
}
function frontInner(c) {
  const s = status(c);
  const showPack = !prefs.pack && packs().length > 1;
  return `<div class="meta"><span>${STATUS[s].label}</span><span>${showPack ? esc(c.pack) : ""}</span></div>` +
         `<div class="term"><span>${esc(c.front)}</span></div>` +

}
function stageHTML(c) {

  let h = '<div class="stage">';
  if (nx) h += `<div class="card next" aria-hidden="true"><div class="face front">${frontInner(nx)}</div></div>`;
  h += `<div class="card cur${flipped ? " flipped" : ""}${enterFrom ? " in-" + enterFrom : ""}" data-id="${c.id}" role="button" tabindex="0" aria-label="${esc(c.front)}. Press space to flip.">` +
       `<div class="flip"><div class="face front">${frontInner(c)}</div>` +
       `<div class="face back"><div class="bhead">${esc(c.front)}</div><div class="def">${esc(c.back)}</div></div></div></div>`;
  enterFrom = null;
  return h + "</div>";
}
function gradesHTML() {
  return '<div class="grades">' +
    `<button class="g no" data-act="grade" data-g="no">${ICON.left}Not yet</button>` +
    `<button class="g almost" data-act="grade" data-g="almost">${ICON.up}Almost</button>` +
    `<button class="g know" data-act="grade" data-g="know">Know${ICON.right}</button>` +

}
function doneHTML(o) {
  return `<div class="done"><h2>${o.title}</h2>${o.text ? `<p>${o.text}</p>` : ""}${o.mix || ""}<div class="actions">${o.actions || ""}</div>${o.note ? `<div class="note">${o.note}</div>` : ""}</div>`;
}
function nextDueNote() {
  const known = cards.filter(c => inPack(c) && status(c) === "known");
  if (!known.length) return "";
  const first = known.reduce((m, c) => Math.min(m, c.nextReview), Infinity);
  const d = dayNum(first);
  const n = known.filter(c => dayNum(c.nextReview) === d).length;
  return `Next review ${whenText(first)}: ${plural(n, "card")}.`;
}
function emptyDeckHTML() {
  return doneHTML({
    title: "No cards yet",
    text: "Add a term, or paste a pack you made with Claude.",
    actions: '<button class="btn" data-act="add-one">Add a card</button><button class="btn alt" data-act="add-paste">Paste a pack</button>'
  });
}
function caughtUpHTML() {
  const where = prefs.pack ? `“${esc(prefs.pack)}”` : "your deck";
  const back = '<button class="btn alt" data-act="focus" data-f="queue">Back to To study</button>';
  if (prefs.focus === "no") return doneHTML({ title: "No Not yet cards", text: `Everything in ${where} is sorted into Almost or Know.`, actions: back });
  if (prefs.focus === "almost") return doneHTML({ title: "No Almost cards", text: "Swipe a card up when you almost know it, and it lands here.", actions: back });
  if (prefs.focus === "all") return doneHTML({ title: "This pack is empty", actions: '<button class="btn" data-act="add-one">Add a card</button>' });
  return doneHTML({
    title: "All caught up",
    text: `Nothing to study in ${where} right now.`,
    actions: '<button class="btn alt" data-act="focus" data-f="all">Go through all cards anyway</button>',
    note: nextDueNote()
  });
}
function finishedHTML() {
  let k = 0, a = 0, no = 0;
  round.ids.forEach(id => { const r = round.res[id]; if (r === "know") k++; else if (r === "almost") a++; else if (r === "no") no++; });
  const parts = [];
  if (k) parts.push(k + " Know"); if (a) parts.push(a + " Almost"); if (no) parts.push(no + " Not yet");
  const total = k + a + no;
  const mix = total ? `<div class="mix" aria-hidden="true">${k ? `<i class="know" style="flex:${k}"></i>` : ""}${a ? `<i class="almost" style="flex:${a}"></i>` : ""}${no ? `<i class="no" style="flex:${no}"></i>` : ""}</div>` : "";
  const nextN = buildIds().length;
  const almostN = cards.filter(c => inPack(c) && c.almost).length;
  let actions = "";
  if (nextN) actions += `<button class="btn" data-act="again">${prefs.focus === "all" ? `Go through all ${nextN} again` : `Study the ${nextN} again`}</button>`;
  if (prefs.focus === "queue" && almostN && almostN < nextN) actions += `<button class="btn alt" data-act="focus" data-f="almost">Only Almost cards (${almostN})</button>`;
  if (!nextN && prefs.focus !== "queue") actions += '<button class="btn alt" data-act="focus" data-f="queue">Back to To study</button>';
  if (!nextN && prefs.focus === "queue") actions += '<button class="btn alt" data-act="focus" data-f="all">Go through all cards anyway</button>';
  return doneHTML({
    title: nextN || prefs.focus !== "queue" ? "Round done" : "All caught up",
    text: total ? `You sorted ${plural(total, "card")}: ${parts.join(", ")}.` : "",
    mix, actions,
    note: prefs.focus === "queue" ? nextDueNote() : ""
  });
}

/* ---------- Text fitting so long terms and definitions stay on the card ---------- */
const TIERS = [[21, 33], [19, 31], [18, 29], [17, 27], [15.5, 25], [14.5, 23], [13.5, 21]];
function fitTerm(el) {
  if (!el) return;
  const L = el.textContent.length;
  let size = L <= 12 ? 46 : L <= 20 ? 40 : L <= 32 ? 34 : L <= 50 ? 28 : L <= 80 ? 24 : 21;
  el.style.fontSize = size + "px";
  el.style.overflowWrap = "normal";
  while (size > 20 && el.scrollWidth > el.clientWidth + 1) { size -= 2; el.style.fontSize = size + "px"; }
  el.style.overflowWrap = "";
  while (size > 15 && el.scrollHeight > el.clientHeight + 1) { size -= 2; el.style.fontSize = size + "px"; }
}
function fitDef(el) {                       // largest size that fits, stepping down
  if (!el) return;
  let i = 0;
  const apply = () => { el.style.setProperty("--fs", TIERS[i][0] + "px"); el.style.setProperty("--lh", TIERS[i][1] + "px"); };
  apply();
  while (i < TIERS.length - 1 && el.scrollHeight > el.clientHeight + 1) { i++; apply(); }
}
function fitAll() {
  main.querySelectorAll(".card .term").forEach(fitTerm);
  main.querySelectorAll(".card .def").forEach(fitDef);
}

  });

}

function settingsHTML() {

function toast(msg) {
  toastEl.textContent = msg;

  toastEl.classList.add("show");
  clearTimeout(toast.t);

function copyText(t) {
  return new Promise(res => {
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta); res(ok);
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(() => res(true), fallback);
    else fallback();

}
function strToB64(s) { return btoa(unescape(encodeURIComponent(s))); }
function b64ToStr(b) { return decodeURIComponent(escape(atob(b))); }
function buildShareLink(list, name) {
  const data = { cards: list.map(c => ({ front: c.front, back: c.back })) };
  if (name) data.name = name;
  return location.href.split("#")[0] + "#import=" + encodeURIComponent(strToB64(JSON.stringify(data)));
}

// Accepts JSON ({"name":..,"cards":[{front,back}]}, a bare array, or a backup) or "term :: definition" lines.
function parsePack(text) {
  text = (text || "").trim().replace(/^```[a-zA-Z]*\s*/, "").replace(/\s*```$/, "").trim();
  if (!text) return null;
  const out = [];
  let name = null;
  if (text[0] === "{" || text[0] === "[") {
    let data;
    try { data = JSON.parse(text); } catch (e) { return null; }
    const arr = Array.isArray(data) ? data : (data && Array.isArray(data.cards) ? data.cards : null);
    const isBackup = data && data.backup === true;
    if (data && !Array.isArray(data) && data.name && !isBackup) name = String(data.name).trim();
    (arr || []).forEach(o => {
      if (!o || typeof o !== "object") return;
      const f = o.front || o.term || o.word || o.q || o.question;
      const b = o.back || o.definition || o.meaning || o.def || o.a || o.answer;
      if (!f || !b) return;
      const item = { front: String(f).trim(), back: String(b).trim() };
      if (o.pack) item.pack = String(o.pack).trim();
      if (isBackup) item.progress = o;
      out.push(item);
    });
  } else {
    text.split(/\r?\n/).forEach(line => {
      line = line.trim();
      if (!line) return;
      const sep = line.includes("::") ? "::" : line.includes("\t") ? "\t" : null;
      if (!sep) return;
      const i = line.indexOf(sep);
      const f = line.slice(0, i).trim(), b = line.slice(i + sep.length).trim();
      if (f && b) out.push({ front: f, back: b });
    });
  }
  return out.length ? { cards: out, name } : null;
}
function doImport(list, name) {
  name = (name || "").trim();
  const have = new Set(cards.map(c => c.pack + "\u0001" + c.front.trim().toLowerCase()));
  let added = 0, skipped = 0;
  const hit = new Set();
  list.forEach(o => {
    const pack = name || o.pack || "Imported";
    const k = pack + "\u0001" + o.front.trim().toLowerCase();
    if (have.has(k)) { skipped++; return; }
    const c = makeCard(o, pack);
    const p = o.progress;
    if (p) {
      if (typeof p.level === "number") c.level = Math.max(0, Math.min(p.level, INTERVALS.length - 1));
      if (typeof p.nextReview === "number") c.nextReview = p.nextReview;
      if (typeof p.inRotation === "boolean") c.inRotation = p.inRotation;
      if (typeof p.almost === "boolean") c.almost = p.almost;
      if (typeof p.seen === "boolean") c.seen = p.seen;
      if (typeof p.addedAt === "number") c.addedAt = p.addedAt;
      if (typeof p.lastReviewed === "number") c.lastReviewed = p.lastReviewed;
    }
    cards.push(c); have.add(k); hit.add(pack); added++;
  });
  persist();
  const skipNote = skipped ? `, skipped ${skipped} already there` : "";
  if (added) {
    const ps = [...hit];
    prefs.pack = ps.length === 1 ? ps[0] : "";
    prefs.focus = "queue";
    savePrefs();
    round = null;
    view = "study";
    render();
    toast(`Imported ${plural(added, "card")}${ps.length === 1 ? " into " + ps[0] : ""}${skipNote}`);
  } else {
    toast(skipped ? "You already have all of these cards" : "No cards found");
  }
  return added;
}
function updateImportInfo() {
  const info = $("#impInfo"), btn = $("#impBtn");
  if (!info || !btn) return;

  const p = parsePack(imp.text);

  const n = p.cards.length;

function showErr(msg) { draft.err = msg; const e = $("#genErr"); if (e) { e.textContent = msg; e.hidden = !msg; } }
function setGenBtn() {
  const b = $("#gen");

}
function generate() {
  const termEl = $("#term");
  const word = (termEl ? termEl.value : draft.term).trim();
  if (!word) { showErr("Type a term first."); if (termEl) termEl.focus(); return; }
  if (busy) return;
  if (!settings.apiKey) { showErr("Add an API key in Settings to use Generate."); return; }
  busy = true; setGenBtn(); showErr("");
  const prompt = 'Explain the term "' + word + '" for a flashcard, in plain, simple language a beginner could understand. ' +
    "Use everyday words and short sentences. Avoid jargon, and if you must use a technical word, explain it in the same breath. " +
    "Where it helps, add a quick intuition, analogy, or concrete example so the idea actually clicks. " +
    "Keep it to 1-3 sentences. Respond with ONLY the explanation text — do not repeat the term, no preamble, no quotation marks.";
  const ctrl = window.AbortController ? new AbortController() : null;
  const timer = setTimeout(() => ctrl && ctrl.abort(), 25000);
  fetch(settings.baseUrl + "/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + settings.apiKey },
    body: JSON.stringify({ model: settings.model, max_tokens: 300, temperature: 0.4, messages: [{ role: "user", content: prompt }] }),
    signal: ctrl ? ctrl.signal : undefined
  })
    .then(res => res.text().then(txt => ({ ok: res.ok, status: res.status, txt })))
    .then(r => {
      let data = null; try { data = JSON.parse(r.txt); } catch (e) {}
      if (!r.ok) {
        const m = data && data.error && data.error.message ? data.error.message : "HTTP " + r.status;
        showErr(r.status === 401 ? "The API key was rejected. Check it in Settings." : "Generate failed: " + m);
        return;
      }
      let text = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      text = (text || "").trim().replace(/^["“]|["”]$/g, "").trim();
      if (!text) { showErr("No definition came back. Try another model in Settings, or write it yourself."); return; }
      draft.def = text;
      const d = $("#def"); if (d) d.value = text;
    })
    .catch(err => {
      showErr(err && err.name === "AbortError" ? "The API took too long to answer. Try again." : "Couldn’t reach the API. Check your connection, key, and provider URL in Settings.");
    })
    .then(() => { clearTimeout(timer); busy = false; setGenBtn(); });
}

/* ============================================================
   Swipe to sort
   ============================================================ */
const TH_X = 95, TH_Y = 85;
const reduceMotion = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function setHot(g, p, el, nx) {
  if (el) { if (g && p >= 1) el.setAttribute("data-g", g); else el.removeAttribute("data-g"); }
  main.querySelectorAll(".g").forEach(b => b.classList.toggle("hot", !!g && p >= 1 && b.dataset.g === g));
  if (nx) { nx.style.transition = "none"; nx.style.transform = `translateY(${12 - 12 * p}px) scale(${0.94 + 0.06 * p})`; }
}
function flipCard(el) {
  flipped = !flipped;
  el.classList.toggle("flipped", flipped);
  if (!prefs.flipped) { prefs.flipped = true; savePrefs(); main.querySelectorAll(".hint").forEach(h => h.remove()); fitAll(); }
}
function flyOut(el, nx, g) {
  animating = true;
  const W = window.innerWidth, H = window.innerHeight;
  const dur = reduceMotion() ? 0 : 280;
  el.style.transition = `transform ${dur}ms cubic-bezier(.4,0,.9,.6), opacity ${dur}ms`;
  if (g === "almost") el.style.transform = `translate(0, ${-H}px) scale(.92)`;
  else { const s = g === "know" ? 1 : -1; el.style.transform = `translate(${s * (W + 200)}px, 40px) rotate(${s * 20}deg)`; }
  el.style.opacity = "0";
  setHot(g, 1, el, null);
  if (nx) { nx.style.transition = `transform ${dur}ms ease`; nx.style.transform = "none"; }
  setTimeout(() => { animating = false; grade(g); render(); }, dur ? dur - 20 : 0);
}
function springBack(el, nx) {
  el.style.transition = "transform .35s cubic-bezier(.2,.9,.3,1.15)";
  el.style.transform = "";
  setHot(null, 0, el, null);
  if (nx) { nx.style.transition = "transform .35s ease"; nx.style.transform = ""; }
}
function sortCurrent(g) {
  if (animating || drag) return;
  const el = main.querySelector(".card.cur");
  if (!el) return;
  flyOut(el, main.querySelector(".card.next"), g);
}

main.addEventListener("pointerdown", e => {
  if (animating || (e.pointerType === "mouse" && e.button !== 0)) return;
  const el = e.target.closest(".card.cur");
  if (!el) return;
  drag = { el, nx: main.querySelector(".card.next"), id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, axis: null, g: null, p: 0, hist: [] };
  try { el.setPointerCapture(e.pointerId); } catch (err) {}
  el.style.transition = "none";
  el.style.animation = "none";
});
window.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.axis) {
    if (dx * dx + dy * dy < 64) return;
    drag.axis = Math.abs(dx) > Math.abs(dy) ? "h" : dy < 0 ? "v" : "down";
  }
  drag.dx = dx; drag.dy = dy;
  drag.hist.push([performance.now(), dx, dy]); if (drag.hist.length > 5) drag.hist.shift();
  let g = null, p = 0, tf;
  if (drag.axis === "h") {
    g = dx > 0 ? "know" : "no"; p = Math.min(1, Math.abs(dx) / TH_X);
    tf = `translate(${dx}px, ${dy * 0.2}px) rotate(${dx * 0.05}deg)`;
  } else if (drag.axis === "v" && dy < 0) {
    g = "almost"; p = Math.min(1, -dy / TH_Y);
    tf = `translate(${dx * 0.2}px, ${dy}px)`;
  } else {
    tf = `translate(0, ${Math.max(0, dy) * 0.25}px)`;
  }
  drag.el.style.transform = tf; drag.g = g; drag.p = p;
  setHot(g, p, drag.el, drag.nx);
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (!d.axis) { d.el.style.transition = ""; d.el.style.transform = ""; if (e.type !== "pointercancel") flipCard(d.el); return; }
  let v = 0;
  if (d.hist.length >= 2) {
    const a = d.hist[0], b = d.hist[d.hist.length - 1], dt = Math.max(1, b[0] - a[0]);
    if (d.g === "know") v = (b[1] - a[1]) / dt;
    else if (d.g === "no") v = (a[1] - b[1]) / dt;
    else if (d.g === "almost") v = (a[2] - b[2]) / dt;
  }
  const dist = d.axis === "h" ? Math.abs(d.dx) : -d.dy;
  const commit = e.type !== "pointercancel" && d.g && (d.p >= 1 || (v > 0.6 && dist > 40));
  if (commit) flyOut(d.el, d.nx, d.g); else springBack(d.el, d.nx);
}
window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);

/* ============================================================
   Events
   ============================================================ */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const a = t.dataset.act;
  switch (a) {
    case "go": if (sheetOpen) closeSheet(); go(t.dataset.v); break;
    case "close-sheet": closeSheet(); break;
    case "packs": packSheet(); break;
    case "setpack":
      prefs.pack = t.dataset.p; savePrefs(); closeSheet(); libFilter = "all"; render(); break;
    case "focus":
      prefs.focus = t.dataset.f; savePrefs(); if (sheetOpen) closeSheet(); render(); break;
    case "grade": sortCurrent(t.dataset.g); break;
    case "undo": undo(); break;
    case "again": newRound(); render(); break;
    case "add-one": addMode = "one"; go("add"); break;
    case "add-paste": addMode = "paste"; go("add"); break;
    case "addmode":
      if (addMode !== t.dataset.m) { addMode = t.dataset.m; render(); }
      break;
    case "generate": generate(); break;
    case "add": addCard(); break;
    case "import": {
      const p = parsePack(imp.text);
      if (p) doImport(p.cards, imp.name || p.name);
      break;
    }
    case "filter":
      libFilter = t.dataset.f; $("#filters").innerHTML = filtersHTML(); $("#rows").innerHTML = rowsHTML(); break;
    case "edit": editSheet(t.dataset.id); break;
    case "saveedit": {
      const c = byId(editingId); if (!c) { closeSheet(); break; }
      const f = $("#eFront").value.trim(), b = $("#eBack").value.trim(), p = $("#ePack").value.trim() || MANUAL_PACK;
      if (!f || !b) { toast("A card needs a term and a definition"); break; }
      c.front = f; c.back = b; c.pack = p; persist();
      if (prefs.pack && !cards.some(x => x.pack === prefs.pack)) { prefs.pack = ""; savePrefs(); }
      closeSheet(); render(); toast("Saved");
      break;
    }
    case "resetcard": {
      const c = byId(editingId); if (!c) break;
      const keep = { front: $("#eFront").value, back: $("#eBack").value, pack: $("#ePack").value };
      Object.assign(c, { inRotation: false, almost: false, level: 0, seen: false, nextReview: Date.now() });
      persist(); editSheet(c.id, keep); if (view === "cards") { $("#filters").innerHTML = filtersHTML(); $("#rows").innerHTML = rowsHTML(); }
      break;
    }
    case "delcard": {
      if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "Tap again to delete"; break; }
      cards = cards.filter(c => c.id !== editingId); persist();
      if (prefs.pack && !cards.some(x => x.pack === prefs.pack)) { prefs.pack = ""; savePrefs(); }
      closeSheet(); render(); toast("Card deleted");
      break;
    }
    case "share": shareSheet(); break;
    case "copylink": { const box = $("#shareBox"); copyText(box.value).then(ok => { toast(ok ? "Link copied" : "Select the link and copy it"); if (!ok) box.select(); }); break; }
    case "rename": renameSheet(); break;
    case "dorename": {
      const nm = $("#rnName").value.trim(), old = prefs.pack;
      if (!nm || nm === old) { closeSheet(); break; }
      cards.forEach(c => { if (c.pack === old) c.pack = nm; });
      persist(); prefs.pack = nm; savePrefs(); closeSheet(); render(); toast("Renamed to " + nm);
      break;
    }
    case "delpack": delPackSheet(); break;
    case "dodelpack": {
      const old = prefs.pack;
      cards = cards.filter(c => c.pack !== old); persist();
      prefs.pack = ""; savePrefs(); closeSheet(); render(); toast("Deleted " + old);
      break;
    }
    case "savekey": {
      settings = { apiKey: $("#sKey").value.trim(), model: $("#sModel").value.trim() || "llama-3.3-70b-versatile", baseUrl: ($("#sUrl").value.trim() || "https://api.groq.com/openai/v1").replace(/\/+$/, "") };
      save(KEYS.settings, settings); toast("Settings saved");
      break;
    }
    case "backup": {
      const data = JSON.stringify({ backup: true, exported: new Date().toISOString(), cards: cards.map(c => ({ front: c.front, back: c.back, pack: c.pack, level: c.level, nextReview: c.nextReview, lastReviewed: c.lastReviewed, inRotation: c.inRotation, almost: c.almost, seen: c.seen, addedAt: c.addedAt })) });
      copyText(data).then(ok => {
        if (ok) toast("Backup copied. Paste it somewhere safe.");
        else openSheet(`<h2 class="sh-t">Backup</h2><p class="help top0" style="margin-bottom:14px">Copy this text and keep it somewhere safe.</p><textarea class="ta link-box" readonly>${esc(data)}</textarea>`);
      });
      break;
    }
    case "pending-import": { const nm = $("#pName").value; const p = pending; pending = null; closeSheet(); doImport(p.cards, nm || p.name); break; }
    case "pending-cancel": pending = null; closeSheet(); break;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "shuffle") { prefs.shuffle = e.target.checked; savePrefs(); newRound(); if (view === "study") render(); }
});
document.addEventListener("input", e => {
  const el = e.target;
  switch (el.id) {
    case "term": draft.term = el.value; break;
    case "def": draft.def = el.value; break;
    case "addPack": draft.pack = el.value; break;
    case "impText": imp.text = el.value; updateImportInfo(); break;
    case "impName": imp.name = el.value; imp.auto = false; break;
    case "q": libQuery = el.value; $("#rows").innerHTML = rowsHTML(); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheetOpen) { closeSheet(); return; }
  const tgt = e.target;
  if (tgt.id === "term" && e.key === "Enter") { e.preventDefault(); if (settings.apiKey) generate(); else $("#def").focus(); return; }
  if (tgt.id === "rnName" && e.key === "Enter") { e.preventDefault(); $('[data-act="dorename"]').click(); return; }
  if (view !== "study" || sheetOpen) return;
  if (tgt.matches && tgt.matches("input, textarea")) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const onButton = tgt.tagName === "BUTTON";
  if ((e.key === " " || e.key === "Enter") && !onButton) {
    const el = main.querySelector(".card.cur");
    if (el && !animating) { e.preventDefault(); flipCard(el); }
    return;
  }
  const map = { ArrowRight: "know", ArrowLeft: "no", ArrowUp: "almost" };
  if (map[e.key]) { e.preventDefault(); sortCurrent(map[e.key]); return; }
  if (e.key === "z" || e.key === "Z" || e.key === "Backspace") { e.preventDefault(); undo(); }
});
let resizeT;
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (view === "study") fitAll(); }, 120); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && view === "study" && !drag && !animating && !sheetOpen) render();
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (view === "study") fitAll(); });

/* ============================================================
   Start
   ============================================================ */
(function readImportLink() {
  const h = location.hash || "";
  let json = null;
  try {
    if (h.indexOf("#import=") === 0) json = b64ToStr(decodeURIComponent(h.slice(8)));
    else if (h.indexOf("#add=") === 0) json = decodeURIComponent(h.slice(5));
  } catch (e) { json = null; }
  if (json) {
    const p = parsePack(json);
    if (p) pending = p;
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  }
})();

if (!storageOK) {
  $("#banner").innerHTML = '<div class="banner">This preview can’t save. Open the file directly in your browser to keep your cards.</div>';
}
savePrefs();
render();
if (pending) importSheet();
</script>
</body>
